services:
  - type: web
    name: strict-attend-flow
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: strict-attend-flow-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: DEFAULTER_THRESHOLD_PERCENT
        value: "75"

databases:
  - name: strict-attend-flow-db
    plan: free
    region: oregon
    databaseName: strict_attend_flow
    user: postgres
